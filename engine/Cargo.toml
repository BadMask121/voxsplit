[package]
name = "voxsplit-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Offline lead/backing vocal separation engine (ONNX Runtime + CoreML)"
license = "MIT"
publish = false

[[bin]]
name = "voxsplit-engine"
path = "src/main.rs"

[lib]
name = "voxsplit"
path = "src/lib.rs"

[features]
default = []
# Windows NVIDIA builds. Off by default: CUDA runtime DLLs are ~1 GB to redistribute.
cuda = ["ort/cuda"]

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-native",
    "copy-dylibs",
    "api-31",
] }
ndarray = "0.17"
realfft = "3.5"
hound = "3.5"
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"] }
rubato = "5"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
ctrlc = { version = "3.5", features = ["termination"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["coreml"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["directml"] }

[dev-dependencies]
tempfile = "3"
hound = "3.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
